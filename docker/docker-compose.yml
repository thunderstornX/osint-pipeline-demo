# Local development stack: PostgreSQL + the pipeline runtime.
#
# Run from the repo root:
#   docker-compose -f docker/docker-compose.yml up
#
# The pipeline service is a one-shot job (docker-compose run --rm pipeline)
# more often than a long-lived container; PostgreSQL stays up between runs
# so you can re-run the pipeline and watch the dedup gate engage.

version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: osint_postgres
    environment:
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: osint
      POSTGRES_DB: osint
    ports:
      - "5432:5432"
    volumes:
      - osint_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint -d osint"]
      interval: 5s
      timeout: 3s
      retries: 5

  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: osint_pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PIPELINE_DATABASE_URL: postgresql://osint:osint@postgres:5432/osint
      PIPELINE_WORKERS: "10"
      PIPELINE_BATCH_SIZE: "500"
    volumes:
      - ../config:/app/config:ro

volumes:
  osint_postgres_data:
